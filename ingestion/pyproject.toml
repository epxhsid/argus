[project]
name = "ingestion"
version = "0.1.0"
description = "ingestion microservice for parsing, extracting, and chunking files into LLM-readable formats for retrieval-augmented generation (RAG) pipelines"
readme = "README.md"
authors = [
    { name = "Joaquin M.", email = "joaqu26@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pymupdf4llm>=1.28.2",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
ingestion = "ingestion:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.20.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
